<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; margin: 0; padding: 14px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1d1d1f; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .server { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; }
    .dot.ok { background: #34a853; }
    .dot.down { background: #ea4335; }
    label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
    .hint { color: #777; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Language Companion</h1>
  <div class="server"><span class="dot" id="dot"></span><span id="server">Checking server…</span></div>
  <label><input type="checkbox" id="youtube"> Overlay on YouTube</label>
  <label><input type="checkbox" id="netflix"> Overlay on Netflix</label>
  <div class="hint">Keys: A previous line, S replay, D next line.</div>
  <script src="popup.js"></script>
</body>
</html>
